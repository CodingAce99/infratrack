server {
    listen 80;
    server_name localhost;

    # Angular production build output (single-page application).
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the Spring Boot app container.
    # Same-origin from the browser: no CORS configuration needed on the backend.
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator endpoints are public (health/info/prometheus); proxy them too
    # so Docker healthchecks and Prometheus scrape the app through the same origin.
    location /actuator/ {
        proxy_pass http://app:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: unknown paths return index.html so client-side routing
    # (deep links, refresh on a non-root path) never 404s. Static hashed
    # assets (JS/CSS) are still served directly by the first try_files match.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
