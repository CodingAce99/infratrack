# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Java 21, Spring Boot 3.5.0, Maven, PostgreSQL/H2, Flyway 11, Angular 19 + TypeScript + Karma/Jasmine (frontend-angular/)
  Architecture: Hexagonal (Ports & Adapters) — strict layer boundaries, domain has zero framework dependencies
  Testing: Backend — JUnit 5 + Mockito, @WebMvcTest slices, Testcontainers. Frontend — Karma + Jasmine with ChromeHeadless (specs alongside each component/service in frontend-angular/).
  Style: Factory methods over constructors, self-validating VOs, DTO mappers in adapter layer, explicit wiring in BeanConfiguration
  Frontend note: Angular 19 SPA under frontend-angular/ (Next.js app under frontend/ was removed in PR4 of angular-dashboard-migration).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "./mvnw test -Dspring.profiles.active=dev"
  verify:
    test_command: "./mvnw test -Dspring.profiles.active=dev"
    build_command: "./mvnw clean verify -Dspring.profiles.active=dev"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  test_runner:
    command: "./mvnw test -Dspring.profiles.active=dev"
    framework: JUnit 5 (Jupiter) + Mockito
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: Java compiler (no Checkstyle/PMD configured)
    type_checker: Java 21 (built-in)
    formatter: Not configured
    frontend_linter: Not configured (no ESLint setup in frontend-angular/)
    frontend_type_checker: TypeScript 5.5 via Angular CLI (ng build / ng test)
    frontend_formatter: Not configured
    frontend_test_runner: Karma 6 + Jasmine 5, ChromeHeadless (npm test in frontend-angular/)
