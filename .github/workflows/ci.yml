name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw clean verify -Dspring.profiles.active=dev
        env:
          INFRATRACK_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install Angular dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Angular tests (Karma + ChromeHeadless)
        working-directory: frontend-angular
        run: npm test -- --browsers=ChromeHeadlessNoSandbox

      - name: Angular production build
        working-directory: frontend-angular
        run: npm run build
